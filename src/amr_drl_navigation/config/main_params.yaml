main_node:
  ros__parameters:
    # Mode
    mode: "training" # Training or testing
    # Robot parameters
    robot_name: "amr" # robot entity name in gazebo
    max_lin_vel: 0.5
    min_lin_vel: 0.0
    max_ang_vel: 1.0
    min_ang_vel: -1.0
    robot_type: "rectangular" # rectangular or circular
    robot_radius: 0.3 # [m], If robot_type is cicrular
    robot_size: [0.14, 0.2] #[0.508, 0.430] # [m, m], Lenght, Width if robot_type is rectangular
    collision_tolerance: 0.01 # [m], tollerance of collision added to robot_radius or robot_size
    warning_tolerance: 0.1 # [m], warning window added to robot_radius or robot_size
    goal_tolerance: 0.04

    # World parameters
    world_name: "small_warehouse.world" # Leave empty to obtain no world
    data_path: "new_indoor.json" # Indicate a goals and poses json file from goals_and_poses folder

    # Task parameters
    task: 'goToPose'
    
    # Sensors parameters
    update_frequency: 15.0
    sensor: 'lidar' 
    visual_data: 'features'
    features: 12544
    channels: 1
    imu_enabled: "false"
    camera_enabled: "false"
    stereo_camera_enabled: "false"
    lidar_enabled: "true"
    sensors_topic:
      laser_topic: "/scan" 
      odom_topic: "/amr_controller/odom"
    laser_param:
      max_distance: 10.0 # Meters
      num_points: 36 # int divider of 360
    

    # Metrics
    robot_poses: True
    robot_velocities: True
    path_distance: True
    distance_path_ratio: False
    clearance_time: True
    mean_velocities: True
    max_min_accelerations: True
    cumulative_heading_average: True
    obstacle_clearance: False
    following_heading_metrics: False
    row_crop_path_comparison: False